<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Legal Router Official Hero Banner</title>
  <desc id="bannerDesc">Official hero banner for Legal Router showcasing governed AI harness capabilities for legal research, contract redlining, citation verification, and compliance.</desc>
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="35%" stop-color="#0F0C1B"/>
      <stop offset="70%" stop-color="#180B1E"/>
      <stop offset="100%" stop-color="#080C16"/>
    </linearGradient>

    <!-- Top & Bottom Border Trim Gradients -->
    <linearGradient id="borderTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9F1239"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="75%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Title Gold Typography Gradient -->
    <linearGradient id="titleGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#FFFBEB"/>
    </linearGradient>

    <!-- Scale Gold Gradients -->
    <linearGradient id="scaleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Wine / Burgundy Gradients -->
    <linearGradient id="wineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BE123C"/>
      <stop offset="40%" stop-color="#9F1239"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </linearGradient>

    <linearGradient id="advisoryBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C0519" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#881337" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#4C0519" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="chipBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141B2D" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0E1322" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="chipBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9F1239" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Pillar Slate/Silver Gradient -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#CBD5E1"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="leftAmbientGlow" cx="180" cy="180" r="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9F1239" stop-opacity="0.45"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="85%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="textAmbientGlow" cx="620" cy="140" r="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#9F1239" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#060913" stop-opacity="0"/>
    </radialGradient>

    <!-- Filter Effects -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Banner Background Canvas -->
  <rect width="1200" height="360" fill="url(#bannerBg)"/>

  <!-- Subtle Judicial Geometric Grid -->
  <g opacity="0.08" stroke="#F59E0B" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="380" y1="0" x2="380" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="1020" y1="0" x2="1020" y2="360"/>
  </g>

  <!-- Ambient Radiant Glow Fields -->
  <rect width="1200" height="360" fill="url(#leftAmbientGlow)"/>
  <rect width="1200" height="360" fill="url(#textAmbientGlow)"/>

  <!-- Top and Bottom Luxury Accent Bars -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#borderTrim)"/>
  <rect x="0" y="356" width="1200" height="4" fill="url(#borderTrim)"/>

  <!-- ==================== LEFT EMBLEM: SCALES & CODEX ==================== -->
  <g transform="translate(180, 180) scale(0.55)" filter="url(#dropShadow)">
    <!-- Emblem Outer Halo Circle -->
    <circle cx="0" cy="0" r="230" fill="#0C0E1A" stroke="url(#borderTrim)" stroke-width="3"/>
    <circle cx="0" cy="0" r="215" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 4"/>

    <!-- Open Codex Base -->
    <path d="M -136 132 C -80 144 -25 148 0 150 C 25 148 80 144 136 132 C 144 130 150 136 148 144 C 136 158 76 170 0 172 C -76 170 -136 158 -148 144 C -150 136 -144 130 -136 132 Z" fill="url(#wineGrad)"/>
    <path d="M 0 142 C -32 138 -84 130 -140 112 L -126 56 C -76 71 -31 79 0 82 Z" fill="#FFFBEB" opacity="0.95"/>
    <path d="M 0 142 C 32 138 84 130 140 112 L 126 56 C 76 71 31 79 0 82 Z" fill="#FEF3C7" opacity="0.95"/>
    <line x1="0" y1="80" x2="0" y2="146" stroke="#F59E0B" stroke-width="2.5"/>

    <!-- Fluted Pillar -->
    <rect x="-14" y="-80" width="28" height="162" fill="url(#pillarGrad)"/>
    <line x1="-7" y1="-76" x2="-7" y2="78" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="1.5"/>
    <line x1="7" y1="-76" x2="7" y2="78" stroke="#0F172A" stroke-opacity="0.8" stroke-width="1.5"/>
    <path d="M -24 -80 L 24 -80 L 18 -92 L -18 -92 Z" fill="url(#scaleGold)"/>

    <!-- Scales Balance Beam -->
    <path d="M 0 -138 L 7 -126 L 0 -114 L -7 -126 Z" fill="url(#scaleGold)" filter="url(#softGlow)"/>
    <path d="M -130 -94 C -84 -108 -34 -112 0 -112 C 34 -112 84 -108 130 -94 C 136 -92 140 -86 138 -80 C 136 -76 130 -74 124 -76 C 84 -88 36 -92 0 -92 C -36 -92 -84 -88 -124 -76 C -130 -74 -136 -76 -138 -80 C -140 -86 -136 -92 -130 -94 Z" fill="url(#scaleGold)"/>

    <!-- Center Pivot Gem -->
    <circle cx="0" cy="-102" r="14" fill="url(#wineGrad)" stroke="url(#scaleGold)" stroke-width="2.5"/>
    <circle cx="0" cy="-102" r="5" fill="#FEF08A" filter="url(#softGlow)"/>

    <!-- Left Pan -->
    <g>
      <circle cx="-132" cy="-84" r="5" fill="url(#scaleGold)"/>
      <line x1="-132" y1="-81" x2="-168" y2="-8" stroke="url(#scaleGold)" stroke-width="1.2"/>
      <line x1="-132" y1="-81" x2="-132" y2="-4" stroke="url(#scaleGold)" stroke-width="1.2"/>
      <line x1="-132" y1="-81" x2="-96" y2="-8" stroke="url(#scaleGold)" stroke-width="1.2"/>
      <ellipse cx="-132" cy="-6" rx="38" ry="8" fill="url(#scaleGold)"/>
      <path d="M -170 -6 C -170 24 -94 24 -94 -6 Z" fill="url(#scaleGold)"/>
    </g>

    <!-- Right Pan -->
    <g>
      <circle cx="132" cy="-84" r="5" fill="url(#scaleGold)"/>
      <line x1="132" y1="-81" x2="96" y2="-8" stroke="url(#scaleGold)" stroke-width="1.2"/>
      <line x1="132" y1="-81" x2="132" y2="-4" stroke="url(#scaleGold)" stroke-width="1.2"/>
      <line x1="132" y1="-81" x2="168" y2="-8" stroke="url(#scaleGold)" stroke-width="1.2"/>
      <ellipse cx="132" cy="-6" rx="38" ry="8" fill="url(#scaleGold)"/>
      <path d="M 94 -6 C 94 24 170 24 170 -6 Z" fill="url(#scaleGold)"/>
    </g>

    <!-- Center Cryptographic Verification Seal -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="32" fill="#0A0E1A" stroke="url(#scaleGold)" stroke-width="2"/>
      <circle cx="0" cy="0" r="26" fill="url(#wineGrad)"/>
      <text x="0" y="8" font-family="'Cinzel', 'Times New Roman', 'Georgia', serif" font-size="24" font-weight="bold" fill="url(#scaleGold)" text-anchor="middle" filter="url(#softGlow)">§</text>
    </g>
  </g>

  <!-- ==================== RIGHT CONTENT: BRANDING & TYPOGRAPHY ==================== -->
  <g transform="translate(360, 42)">
    <!-- Provenance / Ecosystem Overline Pill -->
    <g>
      <rect x="0" y="0" width="460" height="26" rx="13" fill="#140C1E" stroke="url(#borderTrim)" stroke-width="1.2"/>
      <text x="18" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#FBBF24">
        KOALITY-ASSURED  •  DOMAIN AI HARNESS  •  OFFICIAL SPOKE
      </text>
    </g>

    <!-- Main Title Typography -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Times New Roman', serif" font-size="48" font-weight="800" letter-spacing="3" fill="url(#titleGoldGrad)" filter="url(#dropShadow)">
        LEGAL ROUTER
      </text>
    </g>

    <!-- Mission Subtitle -->
    <g transform="translate(0, 102)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#E2E8F0">
        Governed AI Harness for Legal Research, Contract Intelligence &amp; Citation Verification
      </text>
    </g>

    <!-- Core Advisory Work Product Warning Pill -->
    <g transform="translate(0, 126)">
      <rect x="0" y="0" width="580" height="30" rx="6" fill="url(#advisoryBg)" stroke="#F59E0B" stroke-width="1.2" filter="url(#dropShadow)"/>
      <text x="16" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#FFFBEB">
        ADVISORY WORK PRODUCT  •  REQUIRES LICENSED ATTORNEY REVIEW
      </text>
    </g>

    <!-- 4 Capability Badges / Pills -->
    <g transform="translate(0, 178)">
      <!-- Badge 1: US Primary Law -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="370" height="38" rx="8" fill="url(#chipBg)" stroke="url(#chipBorder)" stroke-width="1.2"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FDE68A">
          🏛️  US Primary Law Intake (GovInfo, USC, CFR)
        </text>
      </g>

      <!-- Badge 2: Contract Clause Diff -->
      <g transform="translate(390, 0)">
        <rect x="0" y="0" width="370" height="38" rx="8" fill="url(#chipBg)" stroke="url(#chipBorder)" stroke-width="1.2"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FDE68A">
          📑  Contract Clause Diffing &amp; Redlining
        </text>
      </g>

      <!-- Badge 3: Citation Verification -->
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="370" height="38" rx="8" fill="url(#chipBg)" stroke="url(#chipBorder)" stroke-width="1.2"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FDE68A">
          🔍  Bluebook Citation Verifier (Anti-Hallucination)
        </text>
      </g>

      <!-- Badge 4: SPDX License Compliance -->
      <g transform="translate(390, 48)">
        <rect x="0" y="0" width="370" height="38" rx="8" fill="url(#chipBg)" stroke="url(#chipBorder)" stroke-width="1.2"/>
        <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FDE68A">
          🛡️  SPDX &amp; CycloneDX SBOM License Compliance
        </text>
      </g>
    </g>
  </g>
</svg>
