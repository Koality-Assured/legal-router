name: Harness template CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --quiet pyyaml cryptography ruff bandit
      - name: Lint with Ruff
        run: ruff check scripts
      - name: Security scan with Bandit
        run: bandit -r scripts -ll -ii
      - name: Compile kept Python
        run: python -m compileall -q -f scripts .harness
      - name: Script tests
        run: |
          if [ -d scripts/tests ]; then python -m unittest discover -s scripts/tests -v; fi
      - name: Validate Legal Router
        run: |
          python scripts/validation/validate_legal_router.py --manifest scripts/validation/fixtures/contract-cases.json
